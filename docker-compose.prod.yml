# ============================================================================
# sportudei-ukma — PRODUCTION docker-compose
# Usage: docker compose -f docker-compose.prod.yml up -d --build
# ============================================================================

services:
  # ─── PostgreSQL ──────────────────────────────────────────────────────
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Go Backend (API) ───────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_URL=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    networks:
      - internal
      - web
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Frontend (init container — builds and copies static files) ─────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_MEDIA_URL: ${VITE_MEDIA_URL:-}
        VITE_USE_MOCK: "false"
    # Copy built dist into the shared volume, then exit
    entrypoint: ["sh", "-c", "cp -r /app/dist/* /frontend_dist/ && echo 'Frontend files copied successfully'"]
    volumes:
      - frontend_dist:/frontend_dist
    network_mode: none

  # ─── Nginx (reverse proxy + static files) ──────────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro
      - uploads:/app/uploads:ro
    depends_on:
      frontend:
        condition: service_completed_successfully
      backend:
        condition: service_started
    networks:
      - web
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
    driver: local
  uploads:
    driver: local
  frontend_dist:
    driver: local

networks:
  internal:
    driver: bridge
    internal: true
  web:
    driver: bridge
