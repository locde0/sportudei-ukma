<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Код авторизації — Sportudei</title>
    <!--[if mso]>
    <style type="text/css">
        body, table, td, h1, h2, h3, p { font-family: Arial, sans-serif !important; }
    </style>
    <![endif]-->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&display=swap');
        
        body {
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f7f2;
            margin: 0;
            padding: 40px 20px;
            color: #0a0a0a;
            -webkit-font-smoothing: antialiased;
        }
        
        .container {
            max-width: 480px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 24px;
            padding: 48px 40px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .brand {
            margin-bottom: 32px;
        }

        .brand-name {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #0a0a0a;
            text-decoration: none;
        }

        .brand-dot {
            color: #8ae028;
        }

        .title {
            margin: 0 0 16px 0;
            color: #0a0a0a;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }
        
        .text {
            font-size: 15px;
            line-height: 1.6;
            color: #666666;
            margin: 0 0 32px 0;
        }
        
        .code-box {
            background-color: #ffffff;
            border: 2px dashed #8ae028;
            border-radius: 16px;
            padding: 24px;
            margin: 0 auto 32px auto;
            display: inline-block;
            min-width: 200px;
            box-shadow: 0 8px 24px rgba(138, 224, 40, 0.15);
        }
        
        .code {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: 12px;
            color: #0a0a0a;
            margin: 0;
            /* To center properly with letter-spacing */
            padding-left: 12px; 
        }

        .warning {
            font-size: 14px;
            color: #666666;
            background-color: rgba(138, 224, 40, 0.1);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 32px;
            text-align: left;
            line-height: 1.5;
        }

        .warning strong {
            color: #0a0a0a;
            font-weight: 700;
        }
        
        .footer {
            border-top: 1px solid rgba(0, 0, 0, 0.06);
            padding-top: 24px;
            font-size: 13px;
            color: #999999;
            line-height: 1.5;
        }

        @media (max-width: 480px) {
            .container { padding: 32px 24px; }
            .code { font-size: 36px; letter-spacing: 8px; padding-left: 8px; }
            .code-box { min-width: 160px; padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand">
            <span class="brand-name">Спортудей<span class="brand-dot">.</span></span>
        </div>
        
        <h2 class="title">Вхід в панель керування</h2>
        
        <p class="text">
            Для продовження входу використовуйте цей код підтвердження. 
            Нікому його не повідомляйте.
        </p>
        
        <div class="code-box">
            <div class="code">{{ .Code }}</div>
        </div>
        
        <div class="warning">
            Код діє протягом <strong>5 хвилин</strong>.<br>
            Якщо це були не ви, проігноруйте цей лист.
        </div>
        
        <div class="footer">
            &copy; 2026 Спортудей<br>
            Національний університет «Києво-Могилянська академія»
        </div>
    </div>
</body>
</html>
