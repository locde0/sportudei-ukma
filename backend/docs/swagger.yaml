info:
  contact: {}
  description: sportudei api server
  title: sportudei api
  version: "1.0"
paths:
  /api/admin/contacts:
    post:
      consumes:
      - application/json
      description: Create a new contact link
      parameters:
      - description: Contact data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_locde0_sportudei-ukma_backend_internal_dto.CreateContactRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
      security:
      - BearerAuth: []
      summary: Create contact
      tags:
      - admin-contacts
  /api/admin/contacts/{id}:
    delete:
      description: Delete an existing contact link by ID
      parameters:
      - description: Contact ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - BearerAuth: []
      summary: Delete contact
      tags:
      - admin-contacts
    put:
      consumes:
      - application/json
      description: Update an existing contact link
      parameters:
      - description: Contact ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_locde0_sportudei-ukma_backend_internal_dto.UpdateContactRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - BearerAuth: []
      summary: Update contact
      tags:
      - admin-contacts
  /api/admin/contacts/{id}/order:
    put:
      consumes:
      - application/json
      description: Update the display order of a contact
      parameters:
      - description: Contact ID
        in: path
        name: id
        required: true
        type: integer
      - description: New order
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_locde0_sportudei-ukma_backend_internal_dto.UpdateContactOrderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - BearerAuth: []
      summary: Update contact order
      tags:
      - admin-contacts
  /api/admin/events:
    get:
      description: List all events for admin view with pagination
      parameters:
      - default: 10
        description: Pagination limit
        in: query
        name: limit
        type: integer
      - default: 0
        description: Pagination offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_locde0_sportudei-ukma_backend_internal_dto.AdminEventsListResponse'
      security:
      - BearerAuth: []
      summary: List admin events
      tags:
      - admin-events
    post:
      consumes:
      - multipart/form-data
      description: Create a new event with photos
      parameters:
      - description: CreateEventRequest JSON string
        in: formData
        name: payload
        required: true
        type: string
      - description: Event photos
        in: formData
        name: photos
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
      security:
      - BearerAuth: []
      summary: Create event
      tags:
      - admin-events
  /api/admin/events/{id}:
    delete:
      description: Delete an existing event by ID
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - BearerAuth: []
      summary: Delete event
      tags:
      - admin-events
    get:
      description: Get full event details for admin by ID
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_locde0_sportudei-ukma_backend_internal_dto.AdminEventResponse'
      security:
      - BearerAuth: []
      summary: Get admin event
      tags:
      - admin-events
    put:
      consumes:
      - application/json
      description: Update an existing event and its photos
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_locde0_sportudei-ukma_backend_internal_dto.UpdateEventRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - BearerAuth: []
      summary: Update event
      tags:
      - admin-events
  /api/admin/events/{id}/photos:
    post:
      consumes:
      - multipart/form-data
      description: Upload an additional photo for an event
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: integer
      - description: Photo to upload
        in: formData
        name: photo
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - BearerAuth: []
      summary: Upload event photo
      tags:
      - admin-events
  /api/admin/gallery:
    get:
      description: List all albums for admin view with pagination
      parameters:
      - default: 10
        description: Pagination limit
        in: query
        name: limit
        type: integer
      - default: 0
        description: Pagination offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_locde0_sportudei-ukma_backend_internal_dto.AdminGalleryAlbumsListResponse'
      security:
      - BearerAuth: []
      summary: List admin albums
      tags:
      - admin-gallery
    post:
      consumes:
      - multipart/form-data
      description: Create a new gallery album with a cover photo
      parameters:
      - description: CreateGalleryAlbumRequest JSON string
        in: formData
        name: payload
        required: true
        type: string
      - description: Cover photo
        in: formData
        name: photo
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
      security:
      - BearerAuth: []
      summary: Create album
      tags:
      - admin-gallery
  /api/admin/gallery/{id}:
    delete:
      description: Delete an existing gallery album by ID
      parameters:
      - description: Album ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - BearerAuth: []
      summary: Delete album
      tags:
      - admin-gallery
    get:
      description: Get full album details for admin by ID
      parameters:
      - description: Album ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_locde0_sportudei-ukma_backend_internal_dto.AdminGalleryAlbumResponse'
      security:
      - BearerAuth: []
      summary: Get admin album
      tags:
      - admin-gallery
    put:
      consumes:
      - application/json
      description: Update an existing gallery album and its photos
      parameters:
      - description: Album ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_locde0_sportudei-ukma_backend_internal_dto.UpdateGalleryAlbumRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - BearerAuth: []
      summary: Update album
      tags:
      - admin-gallery
  /api/admin/gallery/{id}/photos:
    post:
      consumes:
      - multipart/form-data
      description: Upload an additional photo for an album
      parameters:
      - description: Album ID
        in: path
        name: id
        required: true
        type: integer
      - description: Photo to upload
        in: formData
        name: photo
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - BearerAuth: []
      summary: Upload album photo
      tags:
      - admin-gallery
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user and sends an OTP if valid
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_locde0_sportudei-ukma_backend_internal_dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: User login
      tags:
      - auth
  /api/auth/refresh:
    post:
      consumes:
      - application/json
      description: Refreshes the access token using a valid refresh token cookie
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_locde0_sportudei-ukma_backend_internal_dto.TokenResponse'
      summary: Refresh token
      tags:
      - auth
  /api/auth/verify:
    post:
      consumes:
      - application/json
      description: Verifies the OTP and issues access and refresh tokens
      parameters:
      - description: OTP data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_locde0_sportudei-ukma_backend_internal_dto.VerifyOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_locde0_sportudei-ukma_backend_internal_dto.TokenResponse'
      summary: Verify OTP
      tags:
      - auth
  /api/contacts:
    get:
      description: List all contact links
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_locde0_sportudei-ukma_backend_internal_dto.ContactsListResponse'
      summary: List contacts
      tags:
      - public-contacts
  /api/events:
    get:
      description: List published events for public view with pagination
      parameters:
      - default: 3
        description: Pagination limit
        in: query
        name: limit
        type: integer
      - default: 0
        description: Pagination offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_locde0_sportudei-ukma_backend_internal_dto.PublicEventsListResponse'
      summary: List public events
      tags:
      - public-events
  /api/events/{id}:
    get:
      description: Get event details for public view by ID
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_locde0_sportudei-ukma_backend_internal_dto.PublicEventResponse'
      summary: Get public event
      tags:
      - public-events
  /api/gallery:
    get:
      description: List published albums for public view with pagination
      parameters:
      - default: 6
        description: Pagination limit
        in: query
        name: limit
        type: integer
      - default: 0
        description: Pagination offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_locde0_sportudei-ukma_backend_internal_dto.PublicGalleryAlbumsListResponse'
      summary: List public albums
      tags:
      - public-gallery
  /api/gallery/{id}:
    get:
      description: Get album details for public view by ID
      parameters:
      - description: Album ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_locde0_sportudei-ukma_backend_internal_dto.PublicGalleryAlbumResponse'
      summary: Get public album
      tags:
      - public-gallery
  /api/gallery/{id}/photos:
    get:
      description: Get photos of an album with pagination
      parameters:
      - description: Album ID
        in: path
        name: id
        required: true
        type: integer
      - default: 10
        description: Pagination limit
        in: query
        name: limit
        type: integer
      - default: 0
        description: Pagination offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_locde0_sportudei-ukma_backend_internal_dto.GalleryPhotosListResponse'
      summary: Get album photos
      tags:
      - public-gallery
  /api/health:
    get:
      description: Check if the API is running
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Health check
      tags:
      - health
