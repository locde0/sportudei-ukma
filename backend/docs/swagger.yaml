info:
  contact: {}
  description: sportudei api server
  title: sportudei api
  version: "1.0"
paths:
  /api/admin/contacts:
    post:
      consumes:
      - application/json
      description: Create a new contact link
      parameters:
      - description: Contact data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_locde0_sportudei-ukma_backend_internal_dto.CreateContactRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
      security:
      - BearerAuth: []
      summary: Create contact
      tags:
      - admin-contacts
  /api/admin/contacts/{id}:
    delete:
      description: Delete an existing contact link by ID
      parameters:
      - description: Contact ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - BearerAuth: []
      summary: Delete contact
      tags:
      - admin-contacts
    put:
      consumes:
      - application/json
      description: Update an existing contact link
      parameters:
      - description: Contact ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_locde0_sportudei-ukma_backend_internal_dto.UpdateContactRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - BearerAuth: []
      summary: Update contact
      tags:
      - admin-contacts
  /api/admin/contacts/{id}/order:
    put:
      consumes:
      - application/json
      description: Update the display order of a contact
      parameters:
      - description: Contact ID
        in: path
        name: id
        required: true
        type: integer
      - description: New order
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_locde0_sportudei-ukma_backend_internal_dto.UpdateContactOrderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - BearerAuth: []
      summary: Update contact order
      tags:
      - admin-contacts
  /api/admin/dashboard:
    get:
      description: Get aggregated stats and recent events for admin dashboard
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_locde0_sportudei-ukma_backend_internal_dto.AdminDashboardResponse'
      security:
      - BearerAuth: []
      summary: Get dashboard stats
      tags:
      - admin-dashboard
  /api/admin/events:
    get:
      description: List all events for admin view with pagination
      parameters:
      - default: 10
        description: Pagination limit
        in: query
        name: limit
        type: integer
      - default: 0
        description: Pagination offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_locde0_sportudei-ukma_backend_internal_dto.AdminEventsListResponse'
      security:
      - BearerAuth: []
      summary: List admin events
      tags:
      - admin-events
    post:
      consumes:
      - multipart/form-data
      description: Create a new event with photos
      parameters:
      - description: CreateEventRequest JSON string
        in: formData
        name: payload
        required: true
        type: string
      - description: Event photos
        in: formData
        name: photos
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
      security:
      - BearerAuth: []
      summary: Create event
      tags:
      - admin-events
  /api/admin/events/{id}:
    delete:
      description: Delete an existing event by ID
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - BearerAuth: []
      summary: Delete event
      tags:
      - admin-events
    get:
      description: Get full event details for admin by ID
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_locde0_sportudei-ukma_backend_internal_dto.AdminEventResponse'
      security:
      - BearerAuth: []
      summary: Get admin event
      tags:
      - admin-events
    put:
      consumes:
      - application/json
      description: Update an existing event and its photos
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_locde0_sportudei-ukma_backend_internal_dto.UpdateEventRequest'
      produces:
      - application/json
      responses:
